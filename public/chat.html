<script type="module">
    //import { accessKeyAzure, recognizer, synthesizer } from '/js/azureTTS.js'

    //

    //const questionBot = document.getElementById('question');

    function detectPlatform() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;

        if (/android/i.test(ua)) {
            return "Android";
        }

        // iOS detection
        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
            return "iOS";
        }

        if (/Win/.test(navigator.platform)) {
            return "Windows";
        }

        if (/Mac/.test(navigator.platform)) {
            return "Mac";
        }

        if (/Linux/.test(navigator.platform)) {
            return "Linux";
        }

        return "Desconocido";
    }

    recordBtn.addEventListener(btnEvent.cancel, async () => {

    async function finalizeAudioCapture(discardAudio) {

        if (!isAudioRecording) return;
        isAudioRecording = false;
        statusMic = 1;
        const audioBlob = await stopAudioRecording();        
        
        if (discardAudio || !audioBlob || audioBlob.size === 0) {
            console.log(audioBlob.size === 0);
            setMicIdleState();
            return;
        }
        try {
            const transcript = await transcribeAudio(audioBlob);
            console.log('transcript',transcript);
            fullTranscription = transcript;
            await stopRecording();
        } catch (error) {
            console.error('Error transcribiendo audio', error);
            setMicIdleState();
        }
    }

    function setMicIdleState() {
        recordBtn.style.background = "linear-gradient(145deg, #007bff, #0056b3)";
        recordBtn.style.boxShadow = "0 12px 25px rgba(0,123,255,0.5)";
        $('#micOn').hide();
        $('#micOff').show();
        $('#recordBtn').prop('disabled', false);
    }

    async function stopRecording() {
       
        $('#recordBtn').prop('disabled', true)
        $('#micOff').show();
        $('#micOn').hide();
        recordBtn.style.background = "linear-gradient(145deg, #007bff, #0056b3)";
        recordBtn.style.boxShadow = "0 12px 25px rgba(0,123,255,0.5)";
        //transcriptionDiv.textContent = "💭 Pensando...";
        showThinkingIcon();
        setTimeout(async function () {
            //transcriptionDiv.textContent = "Transcripción: " + fullTranscription;
            chatUser(fullTranscription);
            let bot = await generateChatResponse(fullTranscription);
            chatBot(bot);
            let chat = await getchatHistory();
            console.log('chat : ', chat);

            //questionBot.textContent = "Bot: " + bot;
            speakAvatar(bot)
            fullTranscription = "";
        }, 3000);
    }

    async function speakAvatar(texto) {

        if (!texto) return;

        const fragments = texto.split(/[.?!,;]+/).map(f => f.trim()).filter(f => f.length > 0);

        /*let ssml = `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="es-ES">`;
        ssml += `<prosody rate="30%" pitch="-4%">`;
        fragments.forEach((frag, index) => {
            ssml += `<p>${frag}</p>`;
            if (index < fragments.length - 1) ssml += `<break time="1ms"/>`;
        });
        ssml += `</prosody></speak>`;*/

        try {
            const { audioBuffer, alignments } = await ttsElevnlabs(texto);


            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const playableBuffer = audioBuffer instanceof ArrayBuffer
                ? audioBuffer.slice(0)
                : await new Blob([audioBuffer]).arrayBuffer();
            const decodedData = await audioCtx.decodeAudioData(playableBuffer);

            const source = audioCtx.createBufferSource();
            source.buffer = decodedData;
            source.connect(audioCtx.destination);
            source.start();
            hideThinkingIcon();
            const visemesArray = alignmentsToVisemes(alignments);

            let i = 0;
            function tick() {
                const currentTime = audioCtx.currentTime * 1000;

                if (i < visemesArray.length && currentTime >= visemesArray[i].offsetMs) {
                    applyViseme(visemesArray[i].id);
                    i++;
                } else if (i < visemesArray.length && currentTime < visemesArray[i].offsetMs - 200) {
                    currentMorphSil();
                }

                let currentPhrase = 0;
                let acumTime = 0;
                for (let j = 0; j < fragments.length; j++) {
                    acumTime += fragments[j].length * 50;
                    if (currentTime < acumTime) {
                        currentPhrase = j; break;
                    }
                }
                const emotion = detectEmotion(fragments[currentPhrase]);
                setExpression(emotion);

                if (i >= visemesArray.length) {
                    currentMorphSil();
                }

                if (i < visemesArray.length) requestAnimationFrame(tick);
            }

            tick();

            source.onended = () => {
                currentMorphSil();
                resetMouthSmoothFast();
                if (playInterview != 0) {
                    $('#micOn').show();
                    $('#micOff').hide();
                }
                $('#recordBtn').prop('disabled', false);
                $('#playBtn').prop('disabled', false);
                audioCtx.close(); // liberar recursos
            };

        } catch (error) {
            console.error('Error reproduciendo audio del avatar:', error);
        }
    }



    function alignmentsToVisemes(alignments) {
        const visemes = [];

        alignments.forEach(block => {
            const chars = block.characters || [];
            const starts = block.character_start_times_seconds || [];
            chars.forEach((char, idx) => {
                const phoneme = char.trim() || 'sil';
                const offsetMs = Math.round((starts[idx] ?? 0) * 1000);
                visemes.push({
                    id: phonemeToViseme(phoneme),
                    offsetMs
                });
            });
        });

        return visemes;
    }

    async function saludo() {
        let bot = await generateChatResponse("");
        chatBot(bot);
        speakAvatar(bot)
        //questionBot.textContent = "Bot: " + bot;

    }

    // timer
    function formatTime(sec) {
        const h = String(Math.floor(sec / 3600)).padStart(2, '0');
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    function startCounter() {
        totalSeconds = 0;
        counterEl.textContent = "00:00:00";
        timerInterval = setInterval(() => {
            totalSeconds++;
            counterEl.textContent = formatTime(totalSeconds);
        }, 1000);
    }

    function stopCounter() {
        clearInterval(timerInterval);
    }

    function chatUser(txt) {
        const userMsg = document.createElement("div");
        userMsg.className = "d-flex justify-content-end mb-2";
        userMsg.innerHTML = `<div class="p-2 rounded-3 bg-success text-white" style="max-width: 80%;">
                          <strong>Yo:</strong> ${txt}
                         </div>`;
        chatBox.appendChild(userMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function chatBot(txt) {
        const botMsg = document.createElement("div");
        botMsg.className = "d-flex justify-content-start mb-2";
        botMsg.innerHTML = `<div class="p-2 rounded-3 bg-secondary text-white" style="max-width: 80%;">
                            <strong>YOBO:</strong> ${txt}
                          </div>`;
        chatBox.appendChild(botMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showThinkingIcon() {
        const icon = document.getElementById("thinkingIcon");
        icon.classList.remove("thinking-hidden");
        icon.classList.add("thinking-visible");
    }

    function hideThinkingIcon() {
        const icon = document.getElementById("thinkingIcon");
        icon.classList.remove("thinking-visible");
        icon.classList.add("thinking-hidden");
    }

    $('#btnexit').on('click', async function () {

        if (playInterview == 0) {
            Swal.fire({
                title: '¿Seguro que quieres salir de la entrevista?',
                text: `Aun no has iniciado la entrevista, el reclutador no podrá decidir si eres el candidato adecuado para la vacante de ${localStorage.getItem('vacant')}`,
                icon: 'question',
                confirmButtonText: 'Salir de la entrevista',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#63B31B',
                allowOutsideClick: false,
                allowEscapeKey: false,
                showCancelButton: true,
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear();
                    window.location.href = `https://yobo.app/`;
                }
            });
        } else {
            $('#recordBtn').prop('disabled', true);
            $('#micOff').show();
            $('#micOn').hide();
            stopCounter();
            await stopAudioRecording({ releaseStream: true });
            releaseAudioStream();

            let username = $('#username').val();
            let chat = await getchatHistory();
            chat.shift()
            await setChatHistory(chat)
            toggleRecording();
        }

    });
</script>
