<script type="module">
    import { recognizer, synthesizer } from '/js/azureTTS.js'
    import { generateChatResponse, getchatHistory } from '/js/openIA.js'
    import { animate, applyViseme, currentMorphSil, resetMouthSmoothFast, setExpression, detectEmotion } from '/js/avatar.js';
    let statusMic = 1;
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    $('#recordBtn').prop('disabled', true);

    recognizer.properties.setProperty(
        SpeechSDK.PropertyId.SpeechServiceConnection_EndSilenceTimeoutMs,
        "10000" // 10 segundos de silencio antes de cerrar la frase
    );
    let playInterview = 0;

    async function init() {
        $("#loading").removeClass("oculto");
        await toggleCamera();
        await animate();
        $("#loading").addClass("oculto");

        setTimeout(async function () {
            speakAvatar(`¡Hola! Qué gusto saludarte!!. Para comenzar tu entrevista, toca el botón de play.Cuando respondas, mantén presionado el botón mientras hablas y suéltalo al terminar, ¿de acuerdo? Yo me encargo del resto.`)
        }, 3000);
    }
    window.addEventListener('DOMContentLoaded', init);

    function detectPlatform() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;

        if (/android/i.test(ua)) {
            return "Android";
        }

        // iOS detection
        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
            return "iOS";
        }

        if (/Win/.test(navigator.platform)) {
            return "Windows";
        }

        if (/Mac/.test(navigator.platform)) {
            return "Mac";
        }

        if (/Linux/.test(navigator.platform)) {
            return "Linux";
        }

        return "Desconocido";
    }


    //const transcriptionDiv = document.getElementById('transcription');
    const recordBtn = document.getElementById('recordBtn');
    //const questionBot = document.getElementById('question');

    let fullTranscription = "";


    let platform = detectPlatform()
    console.log('platform => ', platform);

    let btnEvent = {
        init: (platform == 'Android' || platform == 'iOS') ? 'touchstart' : 'mousedown',
        end: (platform == 'Android' || platform == 'iOS') ? 'touchend' : 'mouseup'
    }
    console.log("eventos:", btnEvent);


    recordBtn.addEventListener(btnEvent.init, () => {
        console.log("grabando audiuo");
        if (statusMic == 1) {
            $('#play').hide();
            $('#micOn').show();
            toggleRecording();
            startCounter();
            playInterview = 1;
        } else {
            recordBtn.style.background = "linear-gradient(145deg, #ff4d4d, #b30000)";
            recordBtn.style.boxShadow = "0 0 25px rgba(255,0,0,0.6)";
            //transcriptionDiv.textContent = "🎤 Grabando...";
            recognizer.startContinuousRecognitionAsync();
        }

    });

    recordBtn.addEventListener(btnEvent.end, async () => {
        $('#recordBtn').prop('disabled', true)
        $('#micOff').show();
        $('#micOn').hide();
        console.log("audiuo");
        if (statusMic == 3) {
            recordBtn.style.background = "linear-gradient(145deg, #007bff, #0056b3)";
            recordBtn.style.boxShadow = "0 12px 25px rgba(0,123,255,0.5)";
            recognizer.stopContinuousRecognitionAsync();
            //transcriptionDiv.textContent = "💭 Pensando...";
            setTimeout(async function () {
                //transcriptionDiv.textContent = "Transcripción: " + fullTranscription;
                console.log('enviando a Open ia: ', fullTranscription);
                chatUser(fullTranscription);
                let bot = await generateChatResponse(fullTranscription);
                chatBot(bot);
                let chat = await getchatHistory();
                console.log('chat : ', chat);

                //questionBot.textContent = "Bot: " + bot;
                speakAvatar(bot)
                fullTranscription = "";
            }, 3000);
        } else {
            saludo();
        }

    });

    // Evento cuando se reconoce texto
    recognizer.recognized = async (s, e) => {
        if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
            fullTranscription += " " + e.result.text;
            console.log('Transcription: ', fullTranscription);
        } else {
            //transcriptionDiv.textContent = "No se reconoció audio correctamente.";
        }
    };

    async function speakAvatar(texto) {

        if (!texto) return;

        const fragments = texto.split(/[.?!,;]+/).map(f => f.trim()).filter(f => f.length > 0);

        let ssml = `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="es-ES">`;
        ssml += `<voice name="es-MX-JorgeNeural">`;
        ssml += `<prosody rate="30%" pitch="-5%">`
        fragments.forEach((frag, index) => {
            ssml += `<p>${frag}</p>`;
            if (index < fragments.length - 1) {
                ssml += `<break time="1ms"/>`;
            }
        });

        ssml += `</prosody></voice></speak>`;

        const visemesArray = [];

        synthesizer.visemeReceived = (s, e) => {
            visemesArray.push({ id: e.privVisemeId, offsetMs: e.privAudioOffset / 10000 });
        };

        synthesizer.speakSsmlAsync(
            ssml,
            async (result) => {
                try {
                    // Convertir Uint8Array o Blob a ArrayBuffer
                    let arrayBuffer;
                    if (result.audioData instanceof Uint8Array) {
                        arrayBuffer = result.audioData.buffer;
                    } else {
                        const blob = new Blob([result.audioData], { type: 'audio/mp3' });
                        arrayBuffer = await blob.arrayBuffer();
                    }

                    // Crear AudioContext
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                    // Decodificar
                    const decodedData = await audioCtx.decodeAudioData(arrayBuffer);

                    // Reproducir
                    const source = audioCtx.createBufferSource();
                    source.buffer = decodedData;
                    source.connect(audioCtx.destination);
                    source.start();

                    // Animar visemas
                    let i = 0;
                    function tick() {
                        const currentTime = audioCtx.currentTime * 1000;
                        if (i < visemesArray.length && currentTime >= visemesArray[i].offsetMs) {
                            applyViseme(visemesArray[i].id);
                            i++;
                        } else if (i < visemesArray.length && currentTime < visemesArray[i].offsetMs - 200) {
                            currentMorphSil();
                        }

                        // Determinar emoción según fragmento
                        let currentPhrase = 0, acumTime = 0;
                        for (let j = 0; j < fragments.length; j++) {
                            acumTime += fragments[j].length * 50;
                            if (currentTime < acumTime) {
                                currentPhrase = j; break;
                            }
                        }
                        const emotion = detectEmotion(fragments[currentPhrase]);
                        setExpression(emotion);

                        if (i >= visemesArray.length) {
                            currentMorphSil();
                        }

                        if (i < visemesArray.length) requestAnimationFrame(tick);
                    }

                    tick();

                    source.onended = () => {
                        currentMorphSil();
                        resetMouthSmoothFast();
                        if (playInterview != 0) {
                            $('#micOn').show();
                            $('#micOff').hide();
                        }
                        $('#recordBtn').prop('disabled', false);
                        audioCtx.close(); // liberar recursos
                    };

                } catch (err) {
                    console.error("Error reproduciendo audio:", err);
                }
            },
            (err) => {
                console.error(err);
            }
        );
    }

    async function saludo() {
        statusMic = 3;
        let bot = await generateChatResponse("");
        chatBot(bot);
        speakAvatar(bot)
        //questionBot.textContent = "Bot: " + bot;

    }

    // timer
    let totalSeconds = 0;
    let timerInterval;
    const counterEl = document.getElementById("counter");
    function formatTime(sec) {
        const h = String(Math.floor(sec / 3600)).padStart(2, '0');
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    function startCounter() {
        totalSeconds = 0;
        counterEl.textContent = "00:00:00";
        timerInterval = setInterval(() => {
            totalSeconds++;
            counterEl.textContent = formatTime(totalSeconds);
        }, 1000);
    }

    function stopCounter() {
        clearInterval(timerInterval);
    }

    function chatUser(txt) {
        const userMsg = document.createElement("div");
        userMsg.className = "d-flex justify-content-end mb-2";
        userMsg.innerHTML = `<div class="p-2 rounded-3 bg-success text-white" style="max-width: 80%;">
                          <strong>Yo:</strong> ${txt}
                         </div>`;
        chatBox.appendChild(userMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function chatBot(txt) {
        const botMsg = document.createElement("div");
        botMsg.className = "d-flex justify-content-start mb-2";
        botMsg.innerHTML = `<div class="p-2 rounded-3 bg-secondary text-white" style="max-width: 80%;">
                            <strong>YOBO:</strong> ${txt}
                          </div>`;
        chatBox.appendChild(botMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    $('#btnexit').on('click', async function () {

        if (playInterview == 0) {
            Swal.fire({
                title: '¿Seguro que quieres salir de la entrevista?',
                text: `Aun no has iniciado la entrevista, el reclutador no podrá decidir si eres el candidato adecuado para la vacante de ${localStorage.getItem('vacant')}`,
                icon: 'question',
                confirmButtonText: 'Salir de la entrevista',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#63B31B',
                allowOutsideClick: false,
                allowEscapeKey: false,
                showCancelButton: true,
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear();
                    window.location.href = `https://yobo.app/`;
                }
            });
        } else {
            $('#recordBtn').prop('disabled', true);
            $('#micOff').show();
            $('#micOn').hide();
            stopCounter();
            recognizer.stopContinuousRecognitionAsync();

            let username = $('#username').val();
            let chat = await getchatHistory();
            chat.shift()
            await setChatHistory(chat)
            toggleRecording();
        }

    });

</script>
